:root{--teal:#3f7f96;--teal-d:#2f6578;--teal-l:#e4f0f4;--or:#ee7a4e;--or-d:#d9612f;--or-l:#fbe3d8;--ink:#1f2d3a;--grey:#5b6b77;--ok:#2e8b57;--ok-l:#e3f4ea;--bad:#c0392b;--bad-l:#fbe5e2;--gold:#f4b400}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 0%,#4f93ab 0%,#2f6578 60%,#244f5e 100%);color:var(--ink);font-family:'OzoneNaskh',serif;font-size:20px;line-height:1.8;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:22px 24px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.top .t{font-weight:700;font-size:22px}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:2px 16px;display:inline-flex;align-items:center;gap:8px}
.pill b{font-size:22px}
.mute{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.math{display:inline-flex;align-items:center;gap:7px;direction:rtl;unicode-bidi:isolate;white-space:nowrap}
.math sup{font-size:.62em;line-height:0;vertical-align:.9em}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;vertical-align:middle;margin:0 3px}
.frac>span{padding:0 6px;align-self:stretch;text-align:center}
.frac>span+span{border-top:2.5px solid currentColor}
sup .frac{line-height:1.05;font-size:1.05em} sup .frac>span{padding:0 1px} sup .frac>span+span{border-top-width:1.5px}
.int{display:inline-block;transform:scaleX(-1);font-size:1.6em;line-height:1}
.rt{display:inline-flex;align-items:flex-end}.rt .rs{display:inline-block;transform:scaleX(-1);line-height:1.05}.rt .rb{border-top:2px solid currentColor;padding:1px 3px 0;line-height:1.15}
/* شاشة البداية */
.start{text-align:center}
.start .tag{display:inline-block;background:var(--or);color:#fff;border-radius:999px;padding:0 20px;font-weight:700}
.start h1{margin:8px 0 0;font-size:clamp(30px,6vw,48px);color:var(--teal-d)}
.start h2{margin:0 0 10px;font-size:24px;color:var(--grey);font-weight:400}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}
.rules div{background:var(--teal-l);border-radius:16px;padding:10px 12px}
.rules .ic{font-size:30px;display:block}
.big-btn{font-family:inherit;font-size:24px;font-weight:700;background:var(--or);color:#fff;border:0;border-radius:16px;padding:10px 40px;cursor:pointer;box-shadow:0 6px 0 var(--or-d);transition:transform .1s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--or-d)}
.big-btn.alt{background:var(--teal);box-shadow:0 6px 0 var(--teal-d)}
/* السؤال */
.prog{display:flex;gap:6px;margin-bottom:12px}
.prog i{flex:1;height:8px;border-radius:4px;background:#e4eef2}
.prog i.ok{background:var(--ok)} .prog i.no{background:var(--bad)} .prog i.cur{background:var(--or)}
.timer{height:10px;border-radius:5px;background:#eef4f6;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--or),var(--ok));transform-origin:right;transition:transform .2s linear}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--grey);font-size:17px}
.lvl{border-radius:999px;padding:0 12px;font-size:15px;color:#fff}
.lvl.k{background:var(--teal)} .lvl.a{background:var(--or)} .lvl.r{background:#7d5ba6}
.q{font-size:24px;margin:8px 0 6px}
.inst{color:var(--grey);font-size:17px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{font-family:inherit;font-size:22px;background:#fff;border:3px solid #d5e5ec;border-radius:16px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:72px;transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--teal);transform:translateY(-2px)}
.opt .ov{width:30px;height:18px;border:2.5px solid var(--ink);border-radius:50%;flex:none}
.opt .tx{flex:1;text-align:center}
.opt.right{border-color:var(--ok);background:var(--ok-l)} .opt.right .ov{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l);animation:shake .4s} .opt.wrong .ov{background:var(--bad);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.fb{margin-top:14px;border-radius:16px;padding:10px 16px;display:none}
.fb.ok{display:block;background:var(--ok-l);color:#1d5e3a}
.fb.no{display:block;background:var(--bad-l);color:#8a2a1f}
.fb b{font-size:22px}
.next{margin-top:14px;text-align:center;display:none}
.pop{position:absolute;left:24px;top:14px;font-weight:700;font-size:28px;color:var(--ok);opacity:0;pointer-events:none}
.pop.go{animation:pop 1s ease}
@keyframes pop{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.streak{color:var(--gold);font-weight:700}
/* النهاية */
.end{text-align:center}
.stars{font-size:64px;letter-spacing:6px;color:#d5e5ec}
.stars span.on{color:var(--gold);display:inline-block;animation:star .6s ease both}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes star{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.score{font-size:46px;color:var(--teal-d);font-weight:700}
.msg{font-size:22px;margin:4px 0 14px}
.review{text-align:right;margin-top:16px}
.review .it{border-right:5px solid var(--bad);background:#fdf5f3;border-radius:12px;padding:8px 14px;margin:8px 0}
.review .it .a{color:var(--ok)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{text-align:center;color:rgba(255,255,255,.75);font-size:15px;margin-top:14px}
.hidden{display:none}
.dint,.bkw{display:inline-flex;align-items:stretch}
.lim{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.6em;line-height:1;min-width:.6em;text-align:center}
.dint .lim{margin-right:3px;padding-bottom:2px}
.bk{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-left:2px solid;border-right:2px solid;background:linear-gradient(currentColor,currentColor) top left/6px 2px no-repeat,linear-gradient(currentColor,currentColor) bottom left/6px 2px no-repeat,linear-gradient(currentColor,currentColor) top right/6px 2px no-repeat,linear-gradient(currentColor,currentColor) bottom right/6px 2px no-repeat}
.bkw .lim{margin-right:1px}
.ab{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-left:2px solid;border-right:2px solid}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="t">سلسلة أوزون · ٧-٤</span>
    <span class="pill">النقاط <b id="pts">٠</b></span>
    <span class="pill streak" id="stk" title="إجابات صحيحة متتالية">🔥 <b id="stkn">٠</b></span>
    <button class="mute" id="mute" aria-label="الصوت">🔊</button></div>

  <div class="card start" id="sStart">
    <span class="tag">لعبة تقويمية ختامية</span>
    <h1>اختبر فهمك</h1>
    <h2>المستوى المركب</h2>
    <div class="rules">
      <div><span class="ic">❓</span>١٠ أسئلة اختيار من متعدد</div>
      <div><span class="ic">⏱️</span>٤٥ ثانية لكل سؤال</div>
      <div><span class="ic">⚡</span>نقاط إضافية للسرعة</div>
      <div><span class="ic">🔥</span>مكافأة للإجابات المتتالية</div>
    </div>
    <button class="big-btn" id="go">ابدأ اللعب</button>
  </div>

  <div class="card hidden" id="sQ">
    <div class="pop" id="pop"></div>
    <div class="prog" id="prog"></div>
    <div class="timer"><i id="tm"></i></div>
    <div class="qhead"><span id="qn"></span><span class="lvl" id="lvl"></span></div>
    <div class="q" id="qt"></div>
    <div class="inst" id="qi"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="next" id="nx"><button class="big-btn alt" id="nxb">السؤال التالي</button></div>
  </div>

  <div class="card end hidden" id="sEnd">
    <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
    <div class="score" id="fs"></div>
    <div class="msg" id="fm"></div>
    <div id="fc"></div>
    <div class="review" id="rv"></div>
    <div style="margin-top:16px"><button class="big-btn" id="again">العب مرة أخرى</button></div>
  </div>
  <footer>سلسلة أوزون · الرياضيات المتقدمة للصف الثاني عشر · الدرس ٧-٤</footer>
</div>
<div class="conf" id="conf"></div>
<script>
const HD = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const fr = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const M = s => `<span class="math"><span>${s}</span></span>`;
const DY = fr('ءص','ءس');
const INST = `(ظلل الشكل <span class="ov" style="display:inline-block;width:24px;height:14px;border:2px solid #1f2d3a;border-radius:50%;vertical-align:middle"></span> المقترن بـ ${M(DY)} )`;
/* كل سؤال: نص، تعليمة، بدائل (الأول هو الصحيح؛ تُخلط عند العرض)، شرح، مستوى */
const INT='<span class="int">∫</span>';
const RT=x=>`<span class="rt"><span class="rs">√</span><span class="rb">${x}</span></span>`;
const IN2=t=>`(ظلل الشكل <span class="ov" style="display:inline-block;width:24px;height:14px;border:2px solid #1f2d3a;border-radius:50%;vertical-align:middle"></span> ${t})`;
const C=' + جـ', H=fr('١','٢'), P32=`<sup>${fr('٣','٢')}</sup>`;
const D=fr('ء','ءس'), S2='س<sup>٢</sup>', S3='س<sup>٣</sup>';
const DI=(a,b)=>`<span class="dint"><span class="int">∫</span><span class="lim"><span>${b}</span><span>${a}</span></span></span>`;
const DD='<span>د(س) ءس</span>';
const MM=(...p)=>`<span class="math">${p.map(x=>`<span>${x}</span>`).join('')}</span>`;
const PM=(...p)=>MM('±',...p);
const IC=t=>IN2('المقترن بالإجابة الصحيحة');
const FR=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const PI=(n,d)=>FR(n+'π',d);
const EX=(r,n,d)=>`<span>${r}</span><span>هـ<sup>ت</sup></span>${PI(n,d)}`;
const QS = [
 {plain:1, q:`مقياس العدد ${MM('٦ + ٨ت')} يساوي`, i:IC(), o:[MM('١٠'),MM('١٤'),MM('٨'),MM('٢')], e:'ر = √(٣٦ + ٦٤) = √١٠٠ = ١٠ .', l:'k'},
 {plain:1, q:`العدد ${MM('−٢ + ٣ت')} يقع في الربع`, i:IC(), o:['الثاني','الأول','الثالث','الرابع'], e:'الجزء الحقيقي سالب والتخيلي موجب ⟸ الربع الثاني.', l:'k'},
 {plain:1, q:`سعة العدد ${MM('−٤')} تساوي`, i:IC(), o:[MM('π'),MM('−π'),MM('٠'),MM(PI('','٢'))], e:'العدد الحقيقي السالب يقع على الجزء السالب من المحور الحقيقي، وسعته π .', l:'k'},
 {plain:1, q:`سعة العدد ${MM('٣ − ٣ت')} تساوي`, i:IC(), o:[MM('−',PI('','٤')),MM(PI('','٤')),MM('−',PI('٣','٤')),MM(PI('٣','٤'))], e:'الربع الرابع: أ = −م = −ظا⁻¹(١) = −π/٤ .', l:'a'},
 {plain:1, q:`الصورة الأسّية للعدد ${MM('−١ + ت')} هي`, i:IC(), o:[MM(RT('٢'),'هـ<sup>ت</sup>',PI('٣','٤')),MM(RT('٢'),'هـ<sup>ت</sup>',PI('','٤')),MM('٢','هـ<sup>ت</sup>',PI('٣','٤')),MM(RT('٢'),'هـ<sup>−ت</sup>',PI('','٤'))], e:'ر = √٢ ، الربع الثاني: أ = π − π/٤ = ٣π/٤ .', l:'a'},
 {plain:1, q:`الصورة الديكارتية للعدد ${MM('٤','هـ<sup>ت</sup>',PI('','٦'))} هي`, i:IC(), o:[MM('٢',RT('٣'),'+ ٢ت'),MM('٢ + ٢',RT('٣'),'ت'),MM('٤ + ٤ت'),MM('٢',RT('٣'),'− ٢ت')], e:'٤(جتا π/٦ + ت جا π/٦) = ٤(√٣/٢ + ت/٢) = ٢√٣ + ٢ت .', l:'a'},
 {plain:1, q:`إذا كان ${MM('ل = ٢ هـ<sup>ت</sup>',PI('','٣'))} و ${MM('ق = ٣ هـ<sup>ت</sup>',PI('','٦'))} فإن ${MM('|ل ق|')} يساوي`, i:IC(), o:[MM('٦'),MM('٥'),MM('١'),MM(FR('٢','٣'))], e:'عند الضرب نضرب المقياسين: ٢ × ٣ = ٦ .', l:'a'},
 {plain:1, q:`إذا كان ${MM('ل = ١٢ هـ<sup>ت</sup>',PI('٢','٣'))} و ${MM('ق = ٤ هـ<sup>ت</sup>',PI('','٣'))} فإن سعة ${MM(FR('ل','ق'))} تساوي`, i:IC(), o:[MM(PI('','٣')),MM(PI('٢','٣')),MM(PI('٣','٣')),MM(PI('٤','٣'))], e:'عند القسمة نطرح السعتين: ٢π/٣ − π/٣ = π/٣ .', l:'a'},
 {plain:1, q:`سعة العدد ل تساوي ${MM(PI('٢','٣'))} وسعة ق تساوي ${MM(PI('٣','٤'))} ، فإن سعة ${MM('ل ق')} تساوي`, i:IC(), o:[MM('−',PI('٧','١٢')),MM(PI('١٧','١٢')),MM(PI('٧','١٢')),MM('−',PI('١٧','١٢'))], e:'المجموع ١٧π/١٢ أكبر من π ⟸ نطرح ٢π فتصبح −٧π/١٢ .', l:'r'},
 {plain:1, q:`عدد مركب ع مقياسه ٥ وجزؤه الحقيقي −٣ ويقع في الربع الثالث ، فإن ع يساوي`, i:IC(), o:[MM('−٣ − ٤ت'),MM('−٣ + ٤ت'),MM('٣ − ٤ت'),MM('−٤ − ٣ت')], e:'س² + ص² = ٢٥ ⟸ ص² = ١٦ ، وفي الربع الثالث ص سالب ⟸ ع = −٣ − ٤ت .', l:'r'},
];
const LV={k:['معرفة','k'],a:['تطبيق','a'],r:['استدلال','r']};
let order=[],cur=0,pts=0,streak=0,res=[],timer=null,tLeft=0,answered=false,muted=false,AC=null;
const $=id=>document.getElementById(id);
function tone(f,d,type='sine'){ if(muted) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=f; g.gain.setValueAtTime(.12,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+d);}catch(e){} }
const good=()=>{tone(660,.15);setTimeout(()=>tone(880,.2),120);} , bad=()=>tone(180,.35,'square');
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ ['sStart','sQ','sEnd'].forEach(s=>$(s).classList.toggle('hidden',s!==id)); window.scrollTo(0,0); }
function setPts(){ $('pts').textContent=HD(pts); $('stkn').textContent=HD(streak); }
function start(){ order=QS.map((q,i)=>i); cur=0;pts=0;streak=0;res=[]; setPts(); show('sQ'); ask(); }
function ask(){
  answered=false; const q=QS[order[cur]];
  $('prog').innerHTML=QS.map((_,i)=>`<i class="${i<cur?(res[i]?'ok':'no'):(i===cur?'cur':'')}"></i>`).join('');
  $('qn').textContent='السؤال '+HD(cur+1)+' من '+HD(QS.length); $('lvl').textContent=LV[q.l][0]; $('lvl').className='lvl '+LV[q.l][1];
  $('qt').innerHTML=(q.l==='k'||q.fixed?'':'')+q.q; $('qi').innerHTML=q.i;
  const opts=q.fixed? q.o.map((t,i)=>[t,i===0]) : shuffle(q.o.map((t,i)=>[t,i===0]));
  $('opts').innerHTML=opts.map(([t,ok],i)=>`<button class="opt" data-ok="${ok?1:0}"><span class="ov"></span><span class="tx">${q.plain?t:M(t)}</span></button>`).join('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b));
  $('fb').className='fb'; $('nx').style.display='none';
  tLeft=45; $('tm').style.transform='scaleX(1)'; clearInterval(timer);
  timer=setInterval(()=>{ tLeft-=0.2; $('tm').style.transform=`scaleX(${Math.max(0,tLeft/45)})`; if(tLeft<=0){ clearInterval(timer); pick(null); } },200);
}
function pick(b){
  if(answered) return; answered=true; clearInterval(timer);
  const q=QS[order[cur]], all=[...$('opts').querySelectorAll('.opt')];
  all.forEach(o=>{ o.disabled=true; if(o.dataset.ok==='1') o.classList.add('right'); });
  const ok = b && b.dataset.ok==='1';
  if(b && !ok) b.classList.add('wrong');
  res.push(ok);
  if(ok){ streak++; const bonus=Math.round(Math.max(0,tLeft)/45*5), st=streak>=3?5:0, gain=10+bonus+st; pts+=gain;
    const p=$('pop'); p.textContent='+'+HD(gain); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); good();
    $('fb').className='fb ok'; $('fb').innerHTML='<b>إجابة صحيحة!</b>'+(st?' 🔥 مكافأة التتابع':'')+'<br>'+q.e;
  } else { streak=0; bad(); $('fb').className='fb no'; $('fb').innerHTML='<b>'+(b?'ليست هذه الإجابة.':'انتهى الوقت!')+'</b><br>'+q.e; }
  setPts(); $('nx').style.display='block'; $('nxb').textContent= cur===QS.length-1 ? 'اعرض النتيجة' : 'السؤال التالي';
}
function next(){ if(cur<QS.length-1){ cur++; ask(); } else finish(); }
function finish(){
  show('sEnd'); const c=res.filter(Boolean).length, n=QS.length, st=c>=9?3:c>=7?2:c>=5?1:0;
  $('stars').querySelectorAll('span').forEach((s,i)=>s.classList.toggle('on',i<st));
  $('fs').textContent=HD(pts)+' نقطة'; $('fm').innerHTML='أجبت إجابة صحيحة عن '+HD(c)+' من '+HD(n)+' أسئلة. '+(st===3?'رائع! أتقنت الأعداد المركبة وحل المعادلات التربيعية.':st===2?'أداء جيد جدًا، راجع الأسئلة التي أخطأت فيها.':st===1?'بداية جيدة، راجع القواعد ثم حاول مرة أخرى.':'راجع الدرس والإنفوجراف ثم أعد المحاولة.');
  const wrong=order.map((qi,i)=>[QS[qi],res[i]]).filter(x=>!x[1]);
  $('rv').innerHTML= wrong.length? '<b>راجع هذه الأسئلة:</b>'+wrong.map(([q])=>`<div class="it">${q.q}<br>الإجابة الصحيحة: <span class="a">${q.plain?q.o[0]:M(q.o[0])}</span><br><span style="color:#5b6b77">${q.e}</span></div>`).join('') : '';
  if(st>=2) confetti(); tone(523,.15); setTimeout(()=>tone(659,.15),150); setTimeout(()=>tone(784,.3),300);
}
function confetti(){ const c=$('conf'); c.innerHTML=''; const col=['#ee7a4e','#3f7f96','#f4b400','#7d5ba6','#2e8b57'];
  for(let i=0;i<80;i++){ const e=document.createElement('i'); e.style.left=Math.random()*100+'%'; e.style.background=col[i%5]; e.style.animationDuration=(2+Math.random()*2)+'s'; e.style.animationDelay=Math.random()*.8+'s'; c.appendChild(e); }
  setTimeout(()=>c.innerHTML='',5000); }
$('go').onclick=start; $('nxb').onclick=next; $('again').onclick=start;
$('mute').onclick=()=>{ muted=!muted; $('mute').textContent=muted?'🔇':'🔊'; };
</script>
</body>
</html>
